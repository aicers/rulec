name: Daily source and differential checks

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/daily.yml'
      - '.github/daily/**'
      - 'examples/daily.rs'
      - 'examples/daily/**'
      - 'Cargo.toml'
      - 'docs/daily.md'

# Serialize all triggers. Only the running execution is protected; GitHub replaces
# a pending execution when another run enters this group. Limit PR triggers above
# to this workflow and its tools to reduce displacement of scheduled runs.
concurrency:
  group: rulec-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Daily conversion and Suricata 7.0.3
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      results: ${{ steps.artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install public tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev suricata=1:7.0.3-1build3
          suricata -V
      - name: Test workflow orchestration without network
        run: python3 -m unittest discover -s .github/daily -p 'test_*.py'
      - name: Build offline tool
        run: cargo build --release --example daily
      - name: Download all three sources independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/daily/run.py download
      - name: Convert and audit all sources independently
        run: target/release/examples/daily convert daily-work daily-results
      - name: Replay verified pcaps
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/daily/run.py suricata
      - name: Compare by pcap, flow and sid
        run: target/release/examples/daily compare daily-work daily-results
      - name: Compare last successful scheduled run and summarize
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/daily/run.py finish
      - name: Preserve reports only
        id: artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-results
          path: daily-results/
          retention-days: 90
          overwrite: true
          if-no-files-found: error
      - name: Assert source, pcap and coverage checks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('daily-results/status.json').read_text())
          print(Path('daily-results/summary.md').read_text(), flush=True)
          raise SystemExit(int(result['failed']))
          PY

  plan-issues:
    name: Preview differential issues
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.results == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: daily-results
          path: daily-results
      - name: List candidates without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: preview
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/daily/run.py issues
      - uses: actions/upload-artifact@v4
        with:
          name: daily-issue-plan
          path: daily-results/issues.json
          retention-days: 90
          overwrite: true

  file-issues:
    name: File unmarked differential issues
    needs: [check, plan-issues]
    if: ${{ !cancelled() && needs.plan-issues.result == 'success' && github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: daily-results
          path: daily-results
      - name: Publish at most twenty deduplicated issues
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/daily/run.py issues
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: daily-filed-issues
          path: daily-results/issues.json
          retention-days: 90
          overwrite: true
