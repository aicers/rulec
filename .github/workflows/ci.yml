name: CI

# `push` is scoped to `main`, so a push to a pull-request branch does not
# run every job a second time beside its `pull_request` run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

# Read-only. The lint and the Rust jobs read the checkout, and the drift
# check reads the pin and the upstream release.
permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25

      # Fails when this repository's copy of the shared instruction blocks
      # stops matching the release `.agent-instructions.toml` pins --
      # because a generated region of AGENTS.md was edited here, or because
      # an update pull request was never merged.
      #
      # `@main`: the scripts are mechanism and come from wherever this
      # reference points, while the blocks are content and come from the
      # pin. No `with:` block, because the release to compare against and
      # the blocks to compare are both read from that one file.
      #
      # Guarded rather than left to the default `success()`, so that a
      # lint failure above does not hide drift. `!cancelled()` rather than
      # `always()`, because a cancelled run should stop, and the
      # `checkout` clause keeps a failed checkout from being reported as a
      # missing pin.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main

  # The Rust jobs below that compile the crate install Boost first:
  # vectorscan-rs builds its vendored vectorscan from source with CMake,
  # which `ubuntu-latest` has, and Boost's headers, which it does not.
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt -- --check --config group_imports=StdExternalCrate

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install vectorscan build dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install vectorscan build dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test

  rust-doc:
    name: Rust doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install vectorscan build dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [markdown, rust-fmt, rust-clippy, rust-test, rust-doc]
    if: ${{ always() }}
    steps:
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
