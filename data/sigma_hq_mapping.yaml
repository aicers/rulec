# Exact logsource triples: absent product/category/service must also be absent
# in the source rule; other logsource keys are ignored. Each list entry has:
# logsource: the SigmaHQ keys; kind: the destination RawEventKind name;
# os: optional OS; fields: explicit source-to-target names; unmapped: names
# that must never map; other: none, snake_case_column (catalog columns only),
# or {prefix: ...}. Explicit unmapped wins, then fields, then other.
# snake_case_column also excludes normalized aliases of unmapped names.
# add: an optional AND map of target field conditions (lists are OR values).
# keywords: an optional target field for keyword lists, with contains.
# YAML aliases share data only; adding an entry requires no converter changes.

- logsource: {"category": "proxy"}
  kind: "http"
  fields: {"c-uri": "uri", "cs-uri": "uri", "cs-host": "host", "c-useragent": "user_agent", "cs-user-agent": "user_agent", "cs-method": "method", "cs-referrer": "referer", "cs-referer": "referer", "cs-cookie": "cookie", "sc-status": "status_code", "src_ip": "orig_addr", "c-ip": "orig_addr", "dst_ip": "resp_addr", "s-ip": "resp_addr", "src_port": "orig_port", "dst_port": "resp_port", "s-port": "resp_port"}
  other: "none"

- logsource: {"category": "webserver"}
