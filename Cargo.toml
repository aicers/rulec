[package]
name = "rulec"
version = "0.1.0"
edition = "2024"
description = "Rule compiler for public signature rules, built on vectorscan"
license = "Apache-2.0"
repository = "https://github.com/aicers/rulec"

[dependencies]
flate2 = "1"
giganto-client = { git = "https://github.com/aicers/giganto-client.git", tag = "0.32.0" }
jiff = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tar = "0.4"
vectorscan-rs = "0.0.6"
yaml-rust2 = "0.13"
# Reads caller-supplied SigmaHQ archives without unrelated codecs or crypto.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Isolates offline daily-workflow failure and archive fixtures.
tempfile = "3"

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "daily"
test = true
